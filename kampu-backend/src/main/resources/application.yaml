spring:
  application:
    name: lp2_gp2
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/XE
    username: LP2
    password: admin123
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  jackson:
    deserialization:
      accept-float-as-int: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /lp2_gp2
  port: 8082

storage:
  location: "images"
